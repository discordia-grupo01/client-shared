name: Auto tag release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  release:
    # Evita que el commit de bump dispare este mismo workflow otra vez
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Determine bump type
        id: bump-type
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == *"[major]"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *"[minor]"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: bump
        run: |
          git fetch --tags --force origin
          npm version ${{ steps.bump-type.outputs.type }} --no-git-tag-version > /dev/null
          VERSION=$(node -p "require('./package.json').version")
          # Si el tag ya existe (creado a mano o por un run que fallo a medias), seguimos subiendo patch
          while git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; do
            echo "::warning::El tag v$VERSION ya existe, se saltea"
            npm version patch --no-git-tag-version > /dev/null
            VERSION=$(node -p "require('./package.json').version")
          done
          NEW_VERSION="v$VERSION"
          git commit -am "chore: bump version to $VERSION [skip ci]"
          git tag -a "$NEW_VERSION" -m "chore: bump version to $VERSION [skip ci]"
          # --atomic: o se suben el commit y el tag juntos, o ninguno
          git push --atomic origin HEAD:main "$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync develop with the version bump
        run: |
          git fetch origin develop main
          git checkout -B develop origin/develop
          if git merge --no-edit origin/main; then
            git push origin develop
          else
            echo "::error::Merging main into develop produced conflicts after the version bump. Resolve manually: git checkout develop && git merge main."
            exit 1
          fi

      - name: Notify downstream repos of the new release
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          for repo in web-client app-mobile; do
            gh api "repos/discordia-grupo01/$repo/dispatches" \
              -f event_type=client-shared-released \
              -F "client_payload[version]=${{ steps.bump.outputs.version }}"
          done